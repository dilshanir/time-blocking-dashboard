<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Time Blocking Planner with Pomodoro Timer · Time Blocking Dashboard</title>
  <meta name="description" content="Plan your day in time blocks, tick off tasks and focus with an adjustable Pomodoro timer. Free, no sign-up — your schedule saves in your browser.">
  <meta name="author" content="Dilshani Rathnayake">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">

  <!-- Theme before first paint: avoids a white flash in dark mode -->
  <script>
    (function () {
      var theme = 'system';
      try {
        var raw = localStorage.getItem('tbd:v1');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && saved.settings && saved.settings.theme) theme = saved.settings.theme;
        }
      } catch (e) { /* storage unavailable: fall back to system */ }
      var dark = theme === 'dark' ||
        (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Development only. Replaced by compiled CSS in the production build (build.mjs). -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --color-page: #f3f5fb;
      --color-ink: #0b1020;
      --color-ink-soft: #4a5568;
      --color-surface: rgb(255 255 255 / 0.84);
      --color-raised: rgb(255 255 255 / 0.92);
      --color-line: rgb(15 23 42 / 0.12);
      --color-calm: #0e7490;
      --color-mid: #6d28d9;
      --color-hot: #be185d;
      --color-on-accent: #ffffff;
    }

    @layer base {
      .dark {
        --color-page: #05070d;
        --color-ink: #e6edf7;
        --color-ink-soft: #9aa7bd;
        --color-surface: rgb(8 12 24 / 0.74);
        --color-raised: rgb(16 22 40 / 0.9);
        --color-line: rgb(148 163 184 / 0.18);
        --color-calm: #22e6ff;
        --color-mid: #a78bfa;
        --color-hot: #ff5aa8;
        --color-on-accent: #03121a;
      }
      html { background: var(--color-page); color: var(--color-ink); }
      body { min-height: 100dvh; }
      :focus-visible { outline: 2px solid var(--color-calm); outline-offset: 2px; }
      dialog::backdrop { background: rgb(2 3 8 / 0.55); backdrop-filter: blur(2px); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    }

    @layer components {
      .panel {
        border: 1px solid var(--color-line);
        background: var(--color-surface);
        border-radius: 22px;
        padding: 1.25rem;
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        backdrop-filter: blur(18px) saturate(140%);
        box-shadow: 0 1px 0 rgb(255 255 255 / 0.04) inset, 0 20px 50px -30px rgb(0 0 0 / 0.55);
      }
      @media (min-width: 640px) { .panel { padding: 1.5rem; } }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        min-height: 44px; padding: 0 1rem; border-radius: 12px;
        font-weight: 500; font-size: 0.9375rem;
        border: 1px solid var(--color-line); color: var(--color-ink);
        transition: background-color 120ms, border-color 120ms, color 120ms;
      }
      .btn:hover { border-color: color-mix(in srgb, var(--color-ink) 30%, transparent); }
      .btn-primary { background: var(--color-calm); border-color: var(--color-calm); color: var(--color-on-accent); }
      .btn-primary:hover { border-color: var(--color-calm); filter: brightness(1.06); }
      .icon-btn {
        display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
        color: var(--color-ink-soft); transition: background-color 120ms, color 120ms;
      }
      .icon-btn:hover { color: var(--color-ink); background: color-mix(in srgb, var(--color-ink) 8%, transparent); }
      .field {
        width: 100%; min-height: 44px; padding: 0 0.875rem; border-radius: 12px;
        border: 1px solid var(--color-line); background: var(--color-raised); color: var(--color-ink);
      }
      .field::placeholder { color: var(--color-ink-soft); opacity: 0.8; }
    }
  </style>
</head>
<body class="font-sans text-ink antialiased">
  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-raised focus:px-4 focus:py-2">Skip to the planner</a>

  <div class="relative z-10">
    <!-- ============ HEADER ============ -->
    <header class="mx-auto max-w-[1200px] px-4 pt-5 sm:px-6 sm:pt-7">
      <div class="flex items-center justify-between gap-4">
        <a href="./" class="flex items-center gap-2.5 rounded-lg text-sm font-medium text-ink-soft hover:text-ink">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" class="shrink-0">
            <rect x="3" y="3" width="18" height="4.5" rx="2" fill="currentColor" opacity=".35"/>
            <rect x="3" y="9.75" width="12" height="4.5" rx="2" fill="var(--color-calm)"/>
            <rect x="3" y="16.5" width="15" height="4.5" rx="2" fill="currentColor" opacity=".6"/>
          </svg>
          <span>Time Blocking Dashboard</span>
        </a>
        <div class="flex items-center gap-1">
          <button id="theme-btn" type="button" class="icon-btn" aria-label="Theme: System. Change theme">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          </button>
          <button id="settings-btn" type="button" class="icon-btn" aria-label="Open settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="mt-8 flex flex-col gap-3 sm:mt-10 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p id="today-date" class="text-ink-soft">&nbsp;</p>
          <h1 class="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">Daily time blocking planner</h1>
        </div>
        <time id="clock" class="flex items-start font-extralight leading-none tracking-tight tabular-nums">
          <span id="clock-hm" class="text-6xl sm:text-7xl lg:text-8xl">--:--</span>
          <span class="ml-1 flex flex-col pt-1 sm:pt-2">
            <span id="clock-s" class="text-2xl text-ink-soft sm:text-3xl">:--</span>
            <span id="clock-period" class="mt-1 text-sm font-normal text-ink-soft"></span>
          </span>
        </time>
      </div>
    </header>

    <div id="banners" class="mx-auto mt-6 max-w-[1200px] space-y-3 px-4 sm:px-6"></div>

    <!-- ============ APP ============ -->
    <main id="app" class="mx-auto mt-6 grid max-w-[1200px] gap-5 px-4 pb-16 sm:px-6 lg:grid-cols-12">
      <section id="timeline-panel" aria-labelledby="timeline-title" class="panel order-2 lg:order-1 lg:col-span-7">
        <div class="flex items-center justify-between gap-3">
          <h2 id="timeline-title" class="text-lg font-semibold">Today's blocks</h2>
        </div>
        <p class="mt-6 text-ink-soft">Your time blocks will appear here.</p>
      </section>

      <div class="order-1 flex flex-col gap-5 lg:order-2 lg:col-span-5">
        <section id="timer-panel" aria-labelledby="timer-title" class="panel">
          <h2 id="timer-title" class="text-lg font-semibold">Focus timer</h2>
          <p class="mt-6 text-ink-soft">The focus timer will appear here.</p>
        </section>

        <section id="tasks-panel" aria-labelledby="tasks-title" class="panel">
          <h2 id="tasks-title" class="text-lg font-semibold">Tasks</h2>
          <p class="mt-6 text-ink-soft">Your task list will appear here.</p>
        </section>
      </div>
    </main>

    <footer class="mx-auto max-w-[1200px] border-t border-line px-4 py-8 text-sm text-ink-soft sm:px-6">
      <p>Built by Dilshani Rathnayake · <span id="year"></span>. Your data never leaves your browser.</p>
    </footer>
  </div>

  <div id="toast-region" class="pointer-events-none fixed inset-x-0 bottom-5 z-40 flex justify-center px-4" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>

  <script>
  'use strict';

  /* ============================== UTIL ============================== */
  const $ = (sel, root = document) => root.querySelector(sel);
  const pad = (n) => String(n).padStart(2, '0');

  /** Local calendar day as YYYY-MM-DD. Never use toISOString() for this: it is UTC. */
  function dayKey(d = new Date()) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  /* ============================== STORE ============================== */
  // Temporary stub: only remembers the theme. Replaced by the full Store in step 3.
  const Store = {
    state: { settings: { theme: 'system', clock24h: null } },
    load() {
      try {
        const raw = localStorage.getItem('tbd:v1');
        if (raw) Object.assign(this.state.settings, JSON.parse(raw).settings || {});
      } catch (e) { /* ignore in stub */ }
    },
    save() {
      try { localStorage.setItem('tbd:v1', JSON.stringify(this.state)); } catch (e) { /* ignore in stub */ }
    },
  };

  /* ============================== THEME ============================== */
  const Theme = (() => {
    const order = ['system', 'light', 'dark'];
    const labels = { system: 'System', light: 'Light', dark: 'Dark' };
    const icons = {
      system: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
      light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      dark: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    };
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const listeners = new Set();

    function isDark() { return document.documentElement.classList.contains('dark'); }

    function apply() {
      const choice = Store.state.settings.theme;
      const dark = choice === 'dark' || (choice === 'system' && media.matches);
      document.documentElement.classList.toggle('dark', dark);
      $('#theme-icon').innerHTML = icons[choice]; // static, trusted markup only
      $('#theme-btn').setAttribute('aria-label', `Theme: ${labels[choice]}. Change theme`);
      $('#theme-btn').title = `Theme: ${labels[choice]}`;
      listeners.forEach((fn) => fn(dark));
    }

    function set(choice) {
      Store.state.settings.theme = choice;
      Store.save();
      apply();
    }

    function init() {
      $('#theme-btn').addEventListener('click', () => {
        const next = order[(order.indexOf(Store.state.settings.theme) + 1) % order.length];
        set(next);
      });
      media.addEventListener('change', () => { if (Store.state.settings.theme === 'system') apply(); });
      apply();
    }

    return { init, apply, set, isDark, onChange: (fn) => listeners.add(fn) };
  })();

  /* ============================== CLOCK ============================== */
  const Clock = (() => {
    let timer = 0;
    let currentDay = dayKey();
    const dayListeners = new Set();
    const minuteListeners = new Set();
    let lastMinute = -1;

    function formatter() {
      const pref = Store.state.settings.clock24h; // null = follow the locale
      const opts = { hour: pref === true ? '2-digit' : 'numeric', minute: '2-digit', second: '2-digit' };
      if (pref !== null) opts.hour12 = !pref;
      return new Intl.DateTimeFormat(undefined, opts);
    }
    const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    function render(now = new Date()) {
      const parts = formatter().formatToParts(now);
      const get = (type) => (parts.find((p) => p.type === type) || {}).value || '';
      $('#clock-hm').textContent = `${get('hour')}:${get('minute')}`;
      $('#clock-s').textContent = `:${get('second')}`;
      $('#clock-period').textContent = get('dayPeriod');
      $('#clock').setAttribute('datetime', `${dayKey(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`);
      $('#today-date').textContent = dateFmt.format(now);
    }

    function tick() {
      const now = new Date();
      render(now);
      const key = dayKey(now);
      if (key !== currentDay) {
        const previous = currentDay;
        currentDay = key;
        dayListeners.forEach((fn) => fn(key, previous));
      }
      if (now.getMinutes() !== lastMinute) {
        lastMinute = now.getMinutes();
        minuteListeners.forEach((fn) => fn(now));
      }
      clearTimeout(timer);
      timer = setTimeout(tick, 1000 - (Date.now() % 1000)); // land on the next second boundary
    }

    function init() {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
      tick();
    }

    return {
      init,
      refresh: tick,
      today: () => currentDay,
      onDayChange: (fn) => dayListeners.add(fn),
      onMinute: (fn) => minuteListeners.add(fn),
    };
  })();

  /* ============================== BOOT ============================== */
  Store.load();
  Theme.init();
  Clock.init();
  $('#year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
